name: Test and Deploy shelter-service to Docker Hub

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: shelter-service

jobs:
  test:
    name: Simulated Ruby Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Bundler
        run: gem install bundler -v 2.6.7

      - name: Install dependencies
        run: bundle install

      - name: Simulated test
        run: echo "No tests implemented yet" && exit 0

  deploy:
    name: Build and Push to Docker Hub
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
